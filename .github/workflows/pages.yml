# The site at https://finui.finstats.no/: the gallery, FinUI create, and what the installer fetches
# (curl -fsSL https://finui.finstats.no/install.sh | sh -s -- <code>), built by tools/build-site.mjs on every push
# to main. FinUI's checks and tests are kept privately and run before a push. No dependencies, so nothing to install first.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
