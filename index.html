<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <title>FinUI</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="FinUI: the components finstats is built from. Vanilla ES modules and plain CSS, no build step, light and dark from one set of tokens.">
  <script>try { const t = localStorage.getItem('finui.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* the device decides */ }</script>
  <!-- The foundation; each component's own stylesheet is added from registry.json, in its order, by demo.js. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="blocks/blocks.css">
  <link rel="stylesheet" href="demo/demo.css">
  <script type="module" src="demo/demo.js"></script>
</head>
<body>
  <div id="demo" class="demo"><p class="demo-loading">Loading FinUI…</p></div>
  <noscript><p class="demo-loading">The gallery draws every component with JavaScript, as FinUI itself does.</p></noscript>
</body>
</html>
